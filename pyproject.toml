[project]
name = "credit-xai"
version = "0.1.0"
description = "Explainable Artificial Intelligence Framework for Credit Risk Assessment and Loan Approval Prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "streamlit>=1.35",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["credit_xai"]
